<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#f5f6f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151914" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/static/manifest.json?v=2" />
    <link rel="icon" type="image/svg+xml" href="/static/icon.svg?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png" />
    <title>Plants</title>
    <link rel="stylesheet" href="/static/style.css?v=care-ui-8" />
  </head>
  <body>
    <div class="app-shell">
      <header class="top" id="top" hidden>
        <a class="logo" href="#/" aria-label="Home"><img src="/static/icon.svg?v=2" alt="" width="38" height="38" /><span id="app-name">Plants</span></a>
        <nav class="tabs" id="tabs" aria-label="Sections">
          <a class="tab" href="#/" data-tab="today">
            <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="16" rx="3"/><path d="M7.5 3v4m9-4v4m-13 3h17m-11.5 5 2 2 4-4"/></svg>
            <span>Today</span>
          </a>
          <a class="tab" href="#/plants" data-tab="plants">
            <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15c0-7 4-11 9-11 0 6-3 10-9 10m0 0C6 14 3 10 3 5c5 0 9 3 9 9m0 0v7m-4 0h8"/></svg>
            <span>Plants</span>
          </a>
          <a class="tab" href="#/settings" data-tab="settings">
            <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h4m5 0h7M4 17h9m5 0h2"/><circle cx="10.5" cy="7" r="2.5"/><circle cx="15.5" cy="17" r="2.5"/></svg>
            <span>Settings</span>
          </a>
        </nav>
        <div class="account">
          <span class="user-badge" id="user-badge"></span>
          <button class="small ghost" id="logout" type="button">Sign out</button>
        </div>
      </header>
      <main class="wrap" id="view" tabindex="-1"><p class="muted" role="status">Loading Plants…</p></main>
    </div>
    <dialog class="modal" id="modal" aria-labelledby="sheet-title"><div class="sheet" id="sheet"></div></dialog>
    <div class="toast" id="toast" role="status" hidden></div>
    <script src="/static/app.js?v=care-ui-8"></script>
  </body>
</html>
